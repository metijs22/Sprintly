<!DOCTYPE html>
<html lang="fa" dir="rtl" data-theme="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>بورد کانبان — دمو زنده | Sprintly</title>
<meta name="description" content="دموی زنده بورد کانبان اسپرینتلی — Issueها رو با درگ‌اند‌دراپ بین مراحل جابه‌جا کنید.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://cdn.jsdelivr.net/gh/rastikerdar/vazirmatn@v33.003/Vazirmatn-font-face.css" rel="stylesheet">
<script>
(function(){
  var t=localStorage.getItem('sprintly-theme');
  if(!t)t=window.matchMedia('(prefers-color-scheme:dark)').matches?'dark':'light';
  document.documentElement.setAttribute('data-theme',t);
})();
</script>
<style>
*{margin:0;padding:0;box-sizing:border-box}
:root{
  --violet-50:#f5f3ff;--violet-100:#ede9fe;--violet-200:#ddd6fe;
  --violet-300:#c4b5fd;--violet-400:#a78bfa;--violet-500:#8b5cf6;--violet-600:#7c3aed;--violet-700:#6d28d9;
  --indigo-500:#6366f1;--indigo-600:#4f46e5;
  --grad:linear-gradient(135deg,#7c3aed 0%,#4f46e5 100%);
  --green:#10b981;--amber:#f59e0b;--red:#ef4444;--blue:#3b82f6;--cyan:#06b6d4;--orange:#f97316;
  --bg:#ffffff;--bg-soft:#f8f7fc;--surface:#ffffff;--surface-2:#f4f2fb;
  --text:#1e1b2e;--text-soft:#5b5670;--text-faint:#8b86a0;--border:#e8e5f3;
  --shadow:0 10px 30px -12px rgba(76,29,149,.15);
  --shadow-lg:0 24px 60px -20px rgba(76,29,149,.28);
  --nav-bg:rgba(255,255,255,.82);
}
[data-theme="dark"]{
  --bg:#0e0c1a;--bg-soft:#141126;--surface:#1a1630;--surface-2:#221d3d;
  --text:#f1effb;--text-soft:#b6b0cf;--text-faint:#7d779a;--border:#2c2748;
  --shadow:0 10px 30px -12px rgba(0,0,0,.5);
  --shadow-lg:0 24px 60px -20px rgba(0,0,0,.6);
  --nav-bg:rgba(14,12,26,.82);
}
html{scroll-behavior:smooth}
body{
  font-family:'Vazirmatn',system-ui,-apple-system,sans-serif;
  background:var(--bg);color:var(--text);line-height:1.85;
  transition:background .3s,color .3s;overflow-x:hidden;
}
a{color:inherit;text-decoration:none}
ul{list-style:none}
button{font-family:inherit;cursor:pointer;border:none;background:none;color:inherit}
input,select,textarea{font-family:inherit}
.container{width:min(1400px,94%);margin-inline:auto}

/* ===== Buttons ===== */
.btn{
  display:inline-flex;align-items:center;justify-content:center;gap:8px;
  font-weight:600;font-size:.92rem;padding:10px 20px;border-radius:12px;
  transition:transform .18s,box-shadow .18s,background .18s,border-color .18s,color .18s;
  white-space:nowrap;
}
.btn:active{transform:translateY(1px)}
.btn-primary{background:var(--grad);color:#fff;box-shadow:0 8px 20px -8px rgba(109,40,217,.55)}
.btn-primary:hover{transform:translateY(-2px);box-shadow:0 14px 28px -10px rgba(109,40,217,.65)}
.btn-outline{border:1.5px solid var(--border);color:var(--text);background:var(--surface)}
.btn-outline:hover{border-color:var(--violet-400);color:var(--violet-600);background:var(--violet-50)}
[data-theme="dark"] .btn-outline:hover{background:var(--surface-2)}
.btn-ghost{color:var(--text-soft)}
.btn-ghost:hover{color:var(--violet-600);background:var(--violet-50)}
[data-theme="dark"] .btn-ghost:hover{background:var(--surface-2)}
.btn-danger{color:var(--red);border:1.5px solid var(--border);background:var(--surface)}
.btn-danger:hover{background:rgba(239,68,68,.08);border-color:var(--red)}
.btn-sm{padding:7px 14px;font-size:.85rem;border-radius:10px}
.btn-lg{padding:13px 28px;font-size:1rem;border-radius:14px}
.btn-block{width:100%}

/* ===== Navbar ===== */
.nav{
  position:fixed;inset-inline:0;top:0;z-index:100;
  background:var(--nav-bg);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);
  border-bottom:1px solid transparent;transition:border-color .3s,box-shadow .3s;
}
.nav.scrolled{border-color:var(--border);box-shadow:0 6px 20px -14px rgba(0,0,0,.3)}
.nav-inner{display:flex;align-items:center;justify-content:space-between;height:64px;gap:14px}
.logo{display:flex;align-items:center;gap:10px;font-weight:800;font-size:1.1rem}
.logo-mark{width:36px;height:36px;border-radius:10px;background:var(--grad);display:grid;place-items:center;color:#fff;box-shadow:0 6px 16px -6px rgba(109,40,217,.6)}
.nav-actions{display:flex;align-items:center;gap:8px}
.theme-btn{width:38px;height:38px;border-radius:10px;display:grid;place-items:center;border:1px solid var(--border);color:var(--text-soft);transition:.2s}
.theme-btn:hover{color:var(--violet-600);border-color:var(--violet-400);background:var(--violet-50)}
[data-theme="dark"] .theme-btn:hover{background:var(--surface-2)}
.theme-btn .sun{display:none}
[data-theme="dark"] .theme-btn .sun{display:block}
[data-theme="dark"] .theme-btn .moon{display:none}

/* ===== App Header ===== */
.app-header{padding:84px 0 0}
.header-top{display:flex;align-items:center;justify-content:space-between;gap:16px;flex-wrap:wrap;margin-bottom:20px}
.header-right{display:flex;align-items:center;gap:14px;flex-wrap:wrap}
.header-right h1{font-size:clamp(1.3rem,2.5vw,1.8rem);font-weight:800}
.badge{display:inline-flex;align-items:center;gap:6px;padding:4px 12px;border-radius:999px;font-size:.78rem;font-weight:700}
.badge .dot{width:7px;height:7px;border-radius:50%}
.badge-live{background:rgba(16,185,129,.12);color:var(--green)}
.badge-live .dot{background:var(--green);box-shadow:0 0 0 3px rgba(16,185,129,.2);animation:pulse 2s infinite}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.4}}
.header-actions{display:flex;gap:8px;flex-wrap:wrap}

/* ===== Search & Stats ===== */
.toolbar{display:flex;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:20px}
.search-box{flex:1;min-width:200px;position:relative}
.search-box svg{position:absolute;inset-inline-start:14px;top:50%;transform:translateY(-50%);color:var(--text-faint)}
.search-box input{
  width:100%;padding:10px 40px 10px 14px;border-radius:12px;border:1.5px solid var(--border);
  background:var(--surface);color:var(--text);font-size:.9rem;transition:border-color .2s,box-shadow .2s;outline:none;
}
.search-box input:focus{border-color:var(--violet-400);box-shadow:0 0 0 3px var(--violet-100)}
[data-theme="dark"] .search-box input:focus{box-shadow:0 0 0 3px rgba(139,92,246,.15)}
.stats-bar{display:flex;gap:10px;flex-wrap:wrap}
.stat-pill{
  display:inline-flex;align-items:center;gap:7px;padding:6px 14px;border-radius:10px;
  background:var(--surface);border:1px solid var(--border);font-size:.82rem;font-weight:600;color:var(--text-soft);
}
.stat-pill .dot{width:8px;height:8px;border-radius:50%}
.stat-pill b{color:var(--text);font-weight:800}

/* ===== Board ===== */
.board-wrap{
  padding-bottom:40px;overflow-x:auto;scrollbar-width:thin;
  scrollbar-color:var(--border) transparent;
}
.board-wrap::-webkit-scrollbar{height:8px}
.board-wrap::-webkit-scrollbar-track{background:transparent}
.board-wrap::-webkit-scrollbar-thumb{background:var(--border);border-radius:4px}
.board{display:grid;grid-template-columns:repeat(4,1fr);gap:16px;min-width:800px}
.board-col{
  background:var(--surface);border:1.5px solid var(--border);border-radius:16px;
  padding:14px;display:flex;flex-direction:column;min-height:300px;
  transition:border-color .2s,background .2s,box-shadow .2s;
}
.board-col.drag-over{
  border-color:var(--violet-400);border-style:dashed;
  background:var(--violet-50);box-shadow:inset 0 0 0 1px var(--violet-300);
}
[data-theme="dark"] .board-col.drag-over{background:rgba(139,92,246,.06)}
.col-head{display:flex;align-items:center;gap:8px;margin-bottom:14px;padding:0 4px}
.col-dot{width:10px;height:10px;border-radius:50%;flex-shrink:0}
.col-title{font-weight:700;font-size:.92rem}
.col-count{
  margin-inline-start:auto;background:var(--surface-2);color:var(--text-soft);
  font-size:.75rem;font-weight:700;padding:2px 10px;border-radius:999px;border:1px solid var(--border);
}
.col-add{
  width:26px;height:26px;border-radius:8px;display:grid;place-items:center;
  color:var(--text-faint);transition:.18s;
}
.col-add:hover{color:var(--violet-600);background:var(--violet-50)}
[data-theme="dark"] .col-add:hover{background:rgba(139,92,246,.12)}

/* ===== Cards ===== */
.k-cards{display:flex;flex-direction:column;gap:10px;flex:1}
.k-card{
  background:var(--surface-2);border:1.5px solid var(--border);border-radius:13px;
  padding:12px;cursor:grab;position:relative;
  transition:transform .18s,box-shadow .18s,border-color .18s,opacity .18s;
}
.k-card:hover{transform:translateY(-2px);box-shadow:var(--shadow);border-color:var(--violet-300)}
.k-card:active{cursor:grabbing}
.k-card.dragging{opacity:.4;transform:rotate(-2deg) scale(1.02);box-shadow:var(--shadow-lg)}
.k-card.landed{animation:land .4s ease}
@keyframes land{0%{transform:scale(1.05)}50%{transform:scale(.98)}100%{transform:scale(1)}}
.k-card.hidden{display:none}
.k-top{display:flex;align-items:center;gap:10px}
.k-meta{flex:1;min-width:0}
.k-meta strong{display:block;font-size:.88rem;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.k-meta small{color:var(--text-faint);font-size:.76rem}
.k-priority{
  font-size:.72rem;font-weight:800;padding:3px 9px;border-radius:999px;flex-shrink:0;
}
.k-priority.critical{background:rgba(239,68,68,.15);color:var(--red)}
.k-priority.high{background:rgba(249,115,22,.15);color:var(--orange)}
.k-priority.medium{background:rgba(245,158,11,.15);color:var(--amber)}
.k-priority.low{background:rgba(16,185,129,.15);color:var(--green)}
.k-tags{display:flex;gap:5px;flex-wrap:wrap;margin-top:9px}
.k-tags span{font-size:.7rem;padding:2px 8px;border-radius:6px;background:var(--surface);border:1px solid var(--border);color:var(--text-soft)}
.k-actions{
  position:absolute;top:8px;inset-inline-end:8px;display:flex;gap:4px;
  opacity:0;transition:opacity .2s;
}
.k-card:hover .k-actions{opacity:1}
.k-action-btn{
  width:26px;height:26px;border-radius:7px;display:grid;place-items:center;
  background:var(--surface);border:1px solid var(--border);color:var(--text-faint);transition:.15s;
}
.k-action-btn:hover{color:var(--violet-600);border-color:var(--violet-400)}
.k-action-btn.del:hover{color:var(--red);border-color:var(--red)}
.avatar{width:36px;height:36px;border-radius:50%;display:grid;place-items:center;color:#fff;font-weight:700;font-size:.88rem;flex-shrink:0}
.av-1{background:linear-gradient(135deg,#8b5cf6,#6366f1)}
.av-2{background:linear-gradient(135deg,#ec4899,#8b5cf6)}
.av-3{background:linear-gradient(135deg,#10b981,#3b82f6)}
.av-4{background:linear-gradient(135deg,#f59e0b,#ef4444)}
.av-5{background:linear-gradient(135deg,#06b6d4,#3b82f6)}
.av-6{background:linear-gradient(135deg,#8b5cf6,#ec4899)}
.empty-col{
  flex:1;display:flex;align-items:center;justify-content:center;
  color:var(--text-faint);font-size:.82rem;border:2px dashed var(--border);
  border-radius:12px;margin-top:4px;padding:20px;text-align:center;
}

/* ===== Modal ===== */
.modal-overlay{
  position:fixed;inset:0;z-index:200;display:none;
  align-items:center;justify-content:center;
  background:rgba(0,0,0,.5);backdrop-filter:blur(6px);
}
.modal-overlay.show{display:flex}
.modal{
  background:var(--surface);border:1px solid var(--border);border-radius:20px;
  padding:32px;max-width:480px;width:92%;box-shadow:var(--shadow-lg);
  animation:popIn .35s ease;max-height:90vh;overflow-y:auto;
}
@keyframes popIn{from{opacity:0;transform:scale(.92) translateY(10px)}to{opacity:1;transform:scale(1) translateY(0)}}
.modal-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:24px}
.modal-head h3{font-size:1.15rem;font-weight:800}
.modal-close{
  width:34px;height:34px;border-radius:10px;display:grid;place-items:center;
  color:var(--text-faint);transition:.18s;
}
.modal-close:hover{color:var(--red);background:rgba(239,68,68,.08)}
.form-group{margin-bottom:16px}
.form-group label{display:block;font-size:.85rem;font-weight:600;color:var(--text-soft);margin-bottom:6px}
.form-group input,.form-group select{
  width:100%;padding:11px 14px;border-radius:11px;border:1.5px solid var(--border);
  background:var(--surface-2);color:var(--text);font-size:.92rem;outline:none;transition:border-color .2s,box-shadow .2s;
}
.form-group input:focus,.form-group select:focus{border-color:var(--violet-400);box-shadow:0 0 0 3px var(--violet-100);background:var(--surface)}
[data-theme="dark"] .form-group input:focus,[data-theme="dark"] .form-group select:focus{box-shadow:0 0 0 3px rgba(139,92,246,.15)}
.form-row{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.modal-actions{display:flex;gap:10px;margin-top:24px}
.modal-actions .btn{flex:1}

/* ===== Toast ===== */
.toast-container{position:fixed;bottom:24px;inset-inline-start:50%;transform:translateX(50%);z-index:300;display:flex;flex-direction:column;gap:8px;align-items:center}
.toast{
  padding:12px 22px;border-radius:12px;font-size:.88rem;font-weight:600;
  box-shadow:var(--shadow-lg);animation:toastIn .3s ease;
  display:flex;align-items:center;gap:8px;
}
@keyframes toastIn{from{opacity:0;transform:translateY(16px)}to{opacity:1;transform:translateY(0)}}
.toast.success{background:var(--green);color:#fff}
.toast.info{background:var(--indigo-600);color:#fff}
.toast.error{background:var(--red);color:#fff}
.toast.out{animation:toastOut .3s ease forwards}
@keyframes toastOut{to{opacity:0;transform:translateY(16px)}}

/* ===== Footer ===== */
.footer{border-top:1px solid var(--border);padding:24px 0;margin-top:20px}
.footer-inner{display:flex;align-items:center;justify-content:space-between;gap:14px;flex-wrap:wrap;font-size:.84rem;color:var(--text-faint)}
.footer-inner a{transition:.18s}
.footer-inner a:hover{color:var(--violet-600)}

/* ===== Responsive ===== */
@media(max-width:1024px){
  .board{grid-template-columns:repeat(2,1fr);min-width:0}
}
@media(max-width:768px){
  .board{grid-template-columns:1fr;min-width:0}
  .board-wrap{overflow-x:visible}
  .header-top{flex-direction:column;align-items:flex-start}
  .header-actions{width:100%}
  .header-actions .btn{flex:1}
  .form-row{grid-template-columns:1fr}
  .modal{padding:24px 18px}
}
</style>
</head>
<body>

<!-- ===== Navbar ===== -->
<header class="nav" id="navbar">
  <div class="container nav-inner">
    <a href="index.html" class="logo">
      <span class="logo-mark">⚡</span>
      Sprintly
    </a>
    <div class="nav-actions">
      <button class="theme-btn" id="themeBtn" aria-label="تغییر تم">
        <svg class="moon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/></svg>
        <svg class="sun" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.93 4.93l1.41 1.41M17.66 17.66l1.41 1.41M2 12h2M20 12h2M6.34 17.66l-1.41 1.41M19.07 4.93l-1.41 1.41"/></svg>
      </button>
      <a href="login.html" class="btn btn-ghost btn-sm">ورود</a>
      <a href="register.html" class="btn btn-primary btn-sm">شروع رایگان</a>
    </div>
  </div>
</header>

<!-- ===== App Header ===== -->
<div class="container app-header">
  <div class="header-top">
    <div class="header-right">
      <h1>بورد کانبان — اسپرینت ۲.۰</h1>
      <span class="badge badge-live"><span class="dot"></span>دموی زنده</span>
    </div>
    <div class="header-actions">
      <button class="btn btn-outline btn-sm" id="resetBtn" title="بازنشانی دمو">
        <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="1 4 1 10 7 10"/><path d="M3.51 15a9 9 0 1 0 2.13-9.36L1 10"/></svg>
        بازنشانی
      </button>
      <button class="btn btn-primary btn-sm" id="addBtn">
        <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>
        افزودن Issue
      </button>
    </div>
  </div>

  <!-- Toolbar -->
  <div class="toolbar">
    <div class="search-box">
      <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
      <input type="text" id="searchInput" placeholder="جستجوی Issue، برچسب، اسیگنی...">
    </div>
    <div class="stats-bar" id="statsBar"></div>
  </div>
</div>

<!-- ===== Board ===== -->
<div class="container board-wrap">
  <div class="board" id="board"></div>
</div>

<!-- ===== Footer ===== -->
<footer class="footer">
  <div class="container footer-inner">
    <span>© ۱۴۰۵ Sprintly — دمو زنده بورد کانبان</span>
    <div style="display:flex;gap:16px;flex-wrap:wrap">
      <a href="index.html">بازگشت به لندینگ</a>
      <a href="issue-detail.html">جزئیات Issue</a>
      <a href="dashboard.html">داشبورد</a>
    </div>
  </div>
</footer>

<!-- ===== Modal ===== -->
<div class="modal-overlay" id="modalOverlay">
  <div class="modal">
    <div class="modal-head">
      <h3 id="modalTitle">افزودن Issue</h3>
      <button class="modal-close" id="modalClose" aria-label="بستن">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>
      </button>
    </div>
    <form id="issueForm" novalidate>
      <input type="hidden" id="editId" value="">
      <div class="form-group">
        <label for="iTitle">عنوان Issue <span style="color:var(--red)">*</span></label>
        <input type="text" id="iTitle" placeholder="مثلا‌: رفع باگ لاگین موبایل" required>
      </div>
      <div class="form-row">
        <div class="form-group">
          <label for="iLabel">برچسب</label>
          <select id="iLabel">
            <option value="Frontend">Frontend</option>
            <option value="Backend">Backend</option>
            <option value="Design">Design</option>
            <option value="QA">QA</option>
            <option value="DevOps">DevOps</option>
            <option value="Docs">Docs</option>
          </select>
        </div>
        <div class="form-group">
          <label for="iPriority">اولویت</label>
          <select id="iPriority">
            <option value="low">Low</option>
            <option value="medium" selected>Medium</option>
            <option value="high">High</option>
            <option value="critical">Critical</option>
          </select>
        </div>
      </div>
      <div class="form-row">
        <div class="form-group">
          <label for="iAssignee">اسایگنی</label>
          <input type="text" id="iAssignee" placeholder="مثلا‌: مهدی">
        </div>
        <div class="form-group">
          <label for="iStage">مرحله</label>
          <select id="iStage">
            <option value="backlog">Backlog</option>
            <option value="todo">To Do</option>
            <option value="inprogress">In Progress</option>
            <option value="done">Done</option>
          </select>
        </div>
      </div>
      <div class="form-group">
        <label for="iDeadline">ددلاین</label>
        <input type="text" id="iDeadline" placeholder="مثلا‌: ۱۴۰۵/۰۷/۲۰">
      </div>
      <div class="form-group">
        <label for="iTags">تگ‌ها (با کاما جدا کنید)</label>
        <input type="text" id="iTags" placeholder="bug, urgent, mobile">
      </div>
      <div class="modal-actions">
        <button type="submit" class="btn btn-primary" id="saveBtn">ذخیره</button>
        <button type="button" class="btn btn-outline" id="cancelBtn">انصراف</button>
      </div>
    </form>
  </div>
</div>

<!-- ===== Toast Container ===== -->
<div class="toast-container" id="toastContainer"></div>

<script>
/* ===================== Constants ===================== */
const STAGES = [
  { id:'backlog',    title:'Backlog',     color:'var(--text-faint)' },
  { id:'todo',       title:'To Do',       color:'var(--blue)' },
  { id:'inprogress', title:'In Progress', color:'var(--amber)' },
  { id:'done',       title:'Done',        color:'var(--green)' }
];
const AV_COLORS = ['av-1','av-2','av-3','av-4','av-5','av-6'];
const STORAGE_KEY = 'sprintly-kanban-data';

const PRIORITY_LABELS = {
  low: 'Low',
  medium: 'Medium',
  high: 'High',
  critical: 'Critical'
};

const DEFAULT_DATA = [
  { id:'i1', title:'رفع باگ لاگین موبایل', label:'Frontend', priority:'critical', assignee:'مهدی', deadline:'۱۴۰۵/۰۷/۱۰', stage:'backlog', av:0, tags:['bug','mobile'] },
  { id:'i2', title:'طراحی صفحه پروفایل', label:'Design', priority:'high', assignee:'سارا', deadline:'۱۴۰۵/۰۷/۱۵', stage:'backlog', av:1, tags:['ui','figma'] },
  { id:'i3', title:'بهینه‌سازی کوئری‌های DB', label:'Backend', priority:'medium', assignee:'رضا', deadline:'۱۴۰۵/۰۷/۲۰', stage:'backlog', av:2, tags:['performance'] },
  { id:'i4', title:'اتصال API پرداخت', label:'Backend', priority:'critical', assignee:'امیر', deadline:'۱۴۰۵/۰۷/۰۸', stage:'todo', av:3, tags:['api','payment'] },
  { id:'i5', title:'ایمیل تأیید ثبت‌نام', label:'Backend', priority:'high', assignee:'نگار', deadline:'۱۴۰۵/۱۲', stage:'todo', av:4, tags:['email','auth'] },
  { id:'i6', title:'داشبورد آمار اسپرینت', label:'Frontend', priority:'high', assignee:'مهدی', deadline:'۱۴۰۵/۰۷/۱۸', stage:'todo', av:5, tags:['dashboard','charts'] },
  { id:'i7', title:'اتصال Webhook اعلان‌ها', label:'DevOps', priority:'medium', assignee:'رضا', deadline:'۱۴۰۵/۰۷/۲۲', stage:'inprogress', av:0, tags:['webhook','notify'] },
  { id:'i8', title:'تست یکپارچگی API', label:'QA', priority:'high', assignee:'سارا', deadline:'۱۴۰۵/۰۷/۱۴', stage:'inprogress', av:1, tags:['testing','api'] },
  { id:'i9', title:'اسپلش اسکرین', label:'Design', priority:'low', assignee:'نگار', deadline:'۱۴۰۵/۰۷/۰۵', stage:'inprogress', av:2, tags:['ui','animation'] },
  { id:'i10', title:'اسپرینت ۱.۹ — تمام شد', label:'Frontend', priority:'medium', assignee:'امیر', deadline:'۱۴۰۵/۰۷/۰۱', stage:'done', av:3, tags:['sprint','release'] },
  { id:'i11', title:'رفع باگ خروجی CSV', label:'Backend', priority:'low', assignee:'مهدی', deadline:'۱۴۰۵/۰۶/۲۸', stage:'done', av:4, tags:['bug','export'] },
  { id:'i12', title:'مستندات API v2', label:'Docs', priority:'low', assignee:'نگار', deadline:'۱۴۰۵/۰۶/۲۵', stage:'done', av:5, tags:['docs','api'] }
];

/* ===================== State ===================== */
let issues = loadData();
let draggedId = null;
let searchQuery = '';

function loadData(){
  try{
    const raw = localStorage.getItem(STORAGE_KEY);
    if(raw) return JSON.parse(raw);
  }catch(e){}
  return JSON.parse(JSON.stringify(DEFAULT_DATA));
}
function saveData(){
  localStorage.setItem(STORAGE_KEY, JSON.stringify(issues));
}

/* ===================== Theme ===================== */
const root = document.documentElement;
document.getElementById('themeBtn').addEventListener('click',()=>{
  const next = root.getAttribute('data-theme')==='dark'?'light':'dark';
  root.setAttribute('data-theme',next);
  localStorage.setItem('sprintly-theme',next);
});

/* ===================== Navbar Scroll ===================== */
const navbar = document.getElementById('navbar');
window.addEventListener('scroll', () => {
  navbar.classList.toggle('scrolled', window.scrollY > 10);
});

/* ===================== Helpers ===================== */
const faNum = n => n.toLocaleString('fa-IR');
const genId = () => 'i' + Date.now() + Math.random().toString(36).slice(2, 6);

/* ===================== Toast ===================== */
function showToast(msg, type = 'success') {
  const container = document.getElementById('toastContainer');
  const t = document.createElement('div');
  t.className = `toast ${type}`;
  const icons = {
    success: '<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"/></svg>',
    info:    '<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><line x1="12" y1="16" x2="12" y2="12"/><line x1="12" y1="8" x2="12.01" y2="8"/></svg>',
    error:   '<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>'
  };
  t.innerHTML = `${icons[type] || ''} ${msg}`;
  container.appendChild(t);
  setTimeout(() => {
    t.classList.add('out');
    setTimeout(() => t.remove(), 300);
  }, 2800);
}

/* ===================== Render Board ===================== */
function renderBoard() {
  const board = document.getElementById('board');
  board.innerHTML = '';

  STAGES.forEach(stage => {
    const col = document.createElement('div');
    col.className = 'board-col';
    col.dataset.stage = stage.id;

    const items = issues.filter(c => c.stage === stage.id && matchesSearch(c));
    const totalInStage = issues.filter(c => c.stage === stage.id).length;

    col.innerHTML = `
      <div class="col-head">
        <span class="col-dot" style="background:${stage.color}"></span>
        <span class="col-title">${stage.title}</span>
        <span class="col-count">${faNum(totalInStage)}</span>
        <button class="col-add" data-stage="${stage.id}" title="افزودن به ${stage.title}">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>
        </button>
      </div>
      <div class="k-cards" data-stage="${stage.id}">
        ${items.length === 0
          ? '<div class="empty-col">Issueای اینجا نیست<br>کارت رو اینجا رها کنید</div>'
          : items.map(c => cardHTML(c)).join('')}
      </div>
    `;
    board.appendChild(col);
  });

  attachCardEvents();
  updateStats();
}

function cardHTML(c) {
  const initial = (c.assignee || '?').trim().charAt(0) || '?';
  const tags = c.tags.map(s => `<span>${s}</span>`).join('');
  const priorityLabel = PRIORITY_LABELS[c.priority] || c.priority;
  return `
    <div class="k-card" draggable="true" data-id="${c.id}">
      <div class="k-actions">
        <button class="k-action-btn edit" data-id="${c.id}" title="ویرایش">
          <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M11 4H4a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7"/><path d="M18.5 2.5a2.12 2.12 0 0 1 3 3L12 15l-4 1 1-4z"/></svg>
        </button>
        <button class="k-action-btn del" data-id="${c.id}" title="حذف">
          <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="3 6 5 6 21 6"/><path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"/></svg>
        </button>
      </div>
      <div class="k-top">
        <span class="avatar ${AV_COLORS[c.av % AV_COLORS.length]}">${initial}</span>
        <div class="k-meta">
          <strong>${c.title}</strong>
          <small>${c.label || '—'} · ${c.assignee || 'بدون اسیگنی'}</small>
        </div>
        <span class="k-priority ${c.priority}">${priorityLabel}</span>
      </div>
      ${c.tags.length ? `<div class="k-tags">${tags}</div>` : ''}
      ${c.deadline ? `<div style="margin-top:8px;font-size:.72rem;color:var(--text-faint)">📅 ${c.deadline}</div>` : ''}
    </div>
  `;
}

function matchesSearch(c) {
  if (!searchQuery) return true;
  const q = searchQuery.toLowerCase();
  return c.title.toLowerCase().includes(q)
      || (c.label || '').toLowerCase().includes(q)
      || (c.assignee || '').toLowerCase().includes(q)
      || c.tags.some(s => s.toLowerCase().includes(q));
}

/* ===================== Stats Bar ===================== */
function updateStats() {
  const bar = document.getElementById('statsBar');
  const total = issues.length;
  const done = issues.filter(c => c.stage === 'done').length;
  const inProgress = issues.filter(c => c.stage === 'inprogress').length;
  const critical = issues.filter(c => c.priority === 'critical' && c.stage !== 'done').length;

  bar.innerHTML = `
    <span class="stat-pill"><span class="dot" style="background:var(--violet-500)"></span>کل: <b>${faNum(total)}</b></span>
    <span class="stat-pill"><span class="dot" style="background:var(--amber)"></span>در جریان: <b>${faNum(inProgress)}</b></span>
    <span class="stat-pill"><span class="dot" style="background:var(--green)"></span>انجام‌شده: <b>${faNum(done)}</b></span>
    <span class="stat-pill"><span class="dot" style="background:var(--red)"></span>فوری: <b>${faNum(critical)}</b></span>
  `;
}

/* ===================== Drag & Drop ===================== */
function attachCardEvents() {
  document.querySelectorAll('.k-card').forEach(card => {
    card.addEventListener('dragstart', e => {
      draggedId = card.dataset.id;
      card.classList.add('dragging');
      e.dataTransfer.effectAllowed = 'move';
      e.dataTransfer.setData('text/plain', draggedId);
    });
    card.addEventListener('dragend', () => {
      card.classList.remove('dragging');
      document.querySelectorAll('.board-col').forEach(c => c.classList.remove('drag-over'));
      draggedId = null;
    });
  });

  document.querySelectorAll('.board-col').forEach(col => {
    col.addEventListener('dragover', e => {
      e.preventDefault();
      e.dataTransfer.dropEffect = 'move';
      col.classList.add('drag-over');
    });
    col.addEventListener('dragleave', e => {
      if (!col.contains(e.relatedTarget)) col.classList.remove('drag-over');
    });
    col.addEventListener('drop', e => {
      e.preventDefault();
      col.classList.remove('drag-over');
      const id = e.dataTransfer.getData('text/plain') || draggedId;
      if (!id) return;
      const item = issues.find(c => c.id === id);
      if (!item) return;
      const newStage = col.dataset.stage;
      if (item.stage === newStage) return;

      item.stage = newStage;
      saveData();
      renderBoard();

      const landed = document.querySelector(`.k-card[data-id="${id}"]`);
      if (landed) landed.classList.add('landed');

      const stageTitle = STAGES.find(s => s.id === newStage)?.title || newStage;
      showToast(`${item.title} به «${stageTitle}» منتقل شد`, 'info');
    });
  });

  // Edit / Delete buttons
  document.querySelectorAll('.k-action-btn.edit').forEach(btn => {
    btn.addEventListener('click', e => {
      e.stopPropagation();
      openModal(btn.dataset.id);
    });
  });
  document.querySelectorAll('.k-action-btn.del').forEach(btn => {
    btn.addEventListener('click', e => {
      e.stopPropagation();
      const id = btn.dataset.id;
      const item = issues.find(c => c.id === id);
      if (!item) return;
      if (confirm(`«${item.title}» حذف شود؟`)) {
        issues = issues.filter(c => c.id !== id);
        saveData();
        renderBoard();
        showToast(`${item.title} حذف شد`, 'error');
      }
    });
  });

  // Column add buttons
  document.querySelectorAll('.col-add').forEach(btn => {
    btn.addEventListener('click', () => {
      openModal(null, btn.dataset.stage);
    });
  });
}

/* ===================== Search ===================== */
const searchInput = document.getElementById('searchInput');
let searchTimeout;
searchInput.addEventListener('input', () => {
  clearTimeout(searchTimeout);
  searchTimeout = setTimeout(() => {
    searchQuery = searchInput.value.trim();
    renderBoard();
  }, 200);
});

/* ===================== Modal ===================== */
const modalOverlay = document.getElementById('modalOverlay');
const issueForm = document.getElementById('issueForm');
const editIdInput = document.getElementById('editId');

function openModal(id = null, defaultStage = 'backlog') {
  const isEdit = !!id;
  document.getElementById('modalTitle').textContent = isEdit ? 'ویرایش Issue' : 'افزودن Issue';
  document.getElementById('saveBtn').textContent = isEdit ? 'ذخیره تغییرات' : 'افزودن';

  if (isEdit) {
    const c = issues.find(x => x.id === id);
    if (!c) return;
    editIdInput.value = c.id;
    document.getElementById('iTitle').value = c.title;
    document.getElementById('iLabel').value = c.label || 'Frontend';
    document.getElementById('iPriority').value = c.priority || 'medium';
    document.getElementById('iAssignee').value = c.assignee || '';
    document.getElementById('iStage').value = c.stage;
    document.getElementById('iDeadline').value = c.deadline || '';
    document.getElementById('iTags').value = c.tags.join(', ');
  } else {
    issueForm.reset();
    editIdInput.value = '';
    document.getElementById('iPriority').value = 'medium';
    document.getElementById('iStage').value = defaultStage;
  }
  modalOverlay.classList.add('show');
  setTimeout(() => document.getElementById('iTitle').focus(), 100);
}

function closeModal() {
  modalOverlay.classList.remove('show');
}

document.getElementById('addBtn').addEventListener('click', () => openModal());
document.getElementById('modalClose').addEventListener('click', closeModal);
document.getElementById('cancelBtn').addEventListener('click', closeModal);
modalOverlay.addEventListener('click', e => {
  if (e.target === modalOverlay) closeModal();
});
document.addEventListener('keydown', e => {
  if (e.key === 'Escape' && modalOverlay.classList.contains('show')) closeModal();
});

/* ===================== Form Submit ===================== */
issueForm.addEventListener('submit', e => {
  e.preventDefault();
  const title = document.getElementById('iTitle').value.trim();
  if (!title) {
    showToast('عنوان Issue الزامی است', 'error');
    document.getElementById('iTitle').focus();
    return;
  }
  const label = document.getElementById('iLabel').value;
  const priority = document.getElementById('iPriority').value;
  const assignee = document.getElementById('iAssignee').value.trim();
  const stage = document.getElementById('iStage').value;
  const deadline = document.getElementById('iDeadline').value.trim();
  const tags = document.getElementById('iTags').value
    .split(',')
    .map(s => s.trim())
    .filter(Boolean);

  const editId = editIdInput.value;
  if (editId) {
    const c = issues.find(x => x.id === editId);
    if (c) {
      c.title = title;
      c.label = label;
      c.priority = priority;
      c.assignee = assignee;
      c.stage = stage;
      c.deadline = deadline;
      c.tags = tags;
      showToast(`${title} ویرایش شد`, 'success');
    }
  } else {
    issues.push({
      id: genId(),
      title,
      label,
      priority,
      assignee,
      stage,
      deadline,
      tags,
      av: Math.floor(Math.random() * AV_COLORS.length)
    });
    showToast(`${title} اضافه شد`, 'success');
  }

  saveData();
  renderBoard();
  closeModal();
});

/* ===================== Reset ===================== */
document.getElementById('resetBtn').addEventListener('click', () => {
  if (!confirm('بورد به حالت اولیه بازنشانی شود؟')) return;
  issues = JSON.parse(JSON.stringify(DEFAULT_DATA));
  saveData();
  searchInput.value = '';
  searchQuery = '';
  renderBoard();
  showToast('بورد بازنشانی شد', 'info');
});

/* ===================== Init ===================== */
renderBoard();
</script>
</body>
</html>
